[project]
name = "mal-rag-assistant"
version = "0.1.0"
description = "RAG assistant for Islamic finance rules and customer account context"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.140.1",
    "uvicorn[standard]==0.51.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "langgraph==1.2.9",
    # Build-time only (kb/chunking.py). Cheap to add: `langchain-core`, its one
    # dependency, is already in the tree via langgraph.
    "langchain-text-splitters==1.1.2",
    # Single Postgres backs both the vector store and the LangGraph checkpointer.
    "langgraph-checkpoint-postgres==3.1.0",
    "psycopg[binary,pool]==3.3.4",
    "pgvector==0.5.0",
    # OpenRouter is OpenAI-compatible — used for both chat and embeddings.
    "openai==2.48.0",
    # PII detection. The spaCy model is pinned as a direct dependency so
    # `uv sync` fetches it — Presidio otherwise tries to pip-install a model on
    # first use, which would be a network call on the request path.
    "presidio-analyzer==2.2.364",
    "en-core-web-lg",
]

[dependency-groups]
dev = [
    "deepeval==4.1.4",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
# Two suites, deliberately separate. `evals/` holds the three assignment
# deliverables and asserts end-to-end behaviour; `tests/` holds unit tests for
# individual modules. Both run by default.
testpaths = ["tests", "evals"]
# Two opt-in markers, deselected by default for different reasons:
#     uv run pytest -m live   # spends real money against OpenRouter
#     TEST_DATABASE_URL=... uv run pytest -m db   # writes and deletes rows
# `db` is opt-in rather than pointed at DATABASE_URL because those tests call
# prune() and replace_document(), and the deployed index is one env var away.
addopts = "-m 'not live and not db'"
markers = [
    "live: hits the real OpenRouter API; deselected by default",
    "db: needs a throwaway Postgres with pgvector at TEST_DATABASE_URL; deselected by default",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Every importable package, and nothing else — `tests` and `evals` are not
# shipped. This list is exhaustive by necessity: anything missing from it is
# absent from the wheel and only fails once installed non-editably, because an
# editable install puts the repo root on sys.path and hides the omission.
packages = ["core", "app", "kb", "rag", "pii", "observability", "accounts"]

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
